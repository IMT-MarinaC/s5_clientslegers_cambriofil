<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cambriofil — le carnet du cambrioleur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Patrick+Hand&family=Permanent+Marker&display=swap"
          rel="stylesheet"
  />
</head>

<body>
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- Fait "trembler" les traits des encadrés : filter: url(#crayon) dans sketch.css -->
    <filter id="crayon">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
    </filter>

    <!-- Hachures des graphiques : fill="url(#fill-...)", listées dans charts/chartTheme.ts -->
    <pattern id="fill-solid" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="var(--ink)" />
    </pattern>
    <pattern id="fill-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--ink)" stroke-width="3" />
    </pattern>
    <pattern id="fill-red-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="var(--red-pencil)" stroke-width="3" />
    </pattern>
    <pattern id="fill-cross" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 0L8 8M8 0L0 8" stroke="var(--ink-soft)" stroke-width="1.5" />
    </pattern>
    <pattern id="fill-dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="var(--ink)" />
    </pattern>
    <pattern id="fill-red" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="var(--red-pencil)" />
    </pattern>
  </defs>
</svg>

<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
