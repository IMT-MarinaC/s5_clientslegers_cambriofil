<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cambriofil — le carnet du cambrioleur</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
          href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Courier+Prime:wght@400;700&family=Patrick+Hand&display=swap"
          rel="stylesheet"
  />
</head>
<body>
<!-- Filtre qui fait "trembler" les traits, utilisé en CSS avec filter: url(#crayon) -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true">
  <filter id="crayon">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="3" result="noise" />
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3" />
  </filter>
</svg>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
